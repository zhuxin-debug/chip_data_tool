<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>芯片数据 · 位映射</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#22334b;--line:#d9e2ee;--muted:#586b84;--panel:#f4f7fb;--accent:#087f8c}
@media(prefers-color-scheme:dark){:root{--bg:#0e1521;--fg:#e1eafa;--line:#36445b;--muted:#a3b5cb;--panel:#182337;--accent:#53ced5}}
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:14px}h3{margin:0 0 8px;font-size:18px}.muted{color:var(--muted);font-size:12px;line-height:1.6}label{display:inline-flex;gap:8px;align-items:center;margin:6px 14px 6px 0}select,input,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}input{width:85px}button{cursor:pointer}button:hover{border-color:var(--accent)}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.bits{display:grid;grid-template-columns:repeat(16,minmax(30px,1fr));gap:4px;margin-top:8px}.bit{padding:3px;text-align:center;min-height:38px}.bit small{display:block;font-size:10px;color:var(--muted)}.one{background:color-mix(in srgb,var(--accent) 12%,var(--bg))}.chosen,.origin{border:2px solid var(--accent);padding:2px}.chosen{background:var(--accent);color:var(--bg)}.chosen small{color:inherit}#detail{min-height:50px;overflow-wrap:anywhere;line-height:1.6}svg{display:block;width:100%;height:86px}path{stroke:var(--accent);stroke-width:1.6;fill:none}.rowtitle{display:flex;justify-content:space-between;align-items:center}.trace{font-family:monospace;overflow-wrap:anywhere;max-height:72px;overflow:auto}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb74d;outline-offset:2px}@media(max-width:600px){.bits{grid-template-columns:repeat(8,minmax(28px,1fr))}label{display:flex}body{padding:6px}}
</style>
<h3>输入 → 输出 · 位来源追踪</h3>
<div class="muted">点击输出 bit 查看来源。逻辑、加减和归约显示结构依赖；多条连线表示共同参与运算。每页最多 64 bit。</div>
<label>查看步骤 <select id="stage" aria-label="查看步骤"></select></label><label>定位输出 bit <input id="jump" type="number" min="0" value="0"></label>
<div class="card"><div class="rowtitle"><b>本步输入</b><label>页 <select id="ipage" aria-label="输入页"></select></label></div><div id="inputs" class="bits"></div></div>
<svg id="links" role="img" aria-label="所选输出位与输入位的连接"></svg>
<div class="card"><div class="rowtitle"><b>本步输出 · 点击选择</b><label>页 <select id="opage" aria-label="输出页"></select></label></div><div id="outputs" class="bits"></div></div>
<div id="detail" class="card" aria-live="polite"></div>
<div class="muted">追溯到原始输入：<span id="original" class="trace"></span></div>
<script>
const DATA=__MAPPING_DATA__;
const $=id=>document.getElementById(id);let stageIndex=DATA.stages.length-1,selected=0;
function expand(ranges){const set=new Set();for(const [lo,hi] of ranges)for(let i=lo;i<=hi;i++)set.add(i);return set}
function compress(bits){const a=[...bits].sort((a,b)=>a-b),out=[];for(let k=0;k<a.length;){let lo=a[k],hi=lo;while(k+1<a.length&&a[k+1]===hi+1)hi=a[++k];out.push(hi===lo?`[${lo}]`:`[${hi}:${lo}]`);k++}return out.reverse().join('、')||'常量，无原始输入依赖'}
function pages(id,width){const el=$(id);el.replaceChildren();for(let p=0;p<Math.ceil(width/64);p++){const option=document.createElement('option');option.value=p;option.textContent=`[${Math.min(width-1,p*64+63)}:${p*64}]`;el.append(option)}}
function cells(id,bits,page,active,output){const el=$(id);el.replaceChildren();const low=Number(page)*64;for(let bit=Math.min(bits.length-1,low+63);bit>=low;bit--){const b=document.createElement('button');b.className='bit'+(bits[bits.length-1-bit]==='1'?' one':'')+(active.has(bit)?(output?' chosen':' origin'):'');b.dataset.bit=bit;b.setAttribute('aria-label',`${output?'输出':'输入'} bit ${bit} 值 ${bits[bits.length-1-bit]}`);const index=document.createElement('small');index.textContent=bit;b.append(index,document.createTextNode(bits[bits.length-1-bit]));if(output){b.onclick=()=>choose(bit)}else{b.tabIndex=-1;b.title=`本步 input[${bit}]`}el.append(b)}}
function original(){let bits=new Set([selected]);for(let s=stageIndex;s>=0;s--){const next=new Set();for(const bit of bits)for(const b of expand(DATA.stages[s].rules[bit][0]))next.add(b);bits=next}return bits}
function links(){const svg=$('links');svg.replaceChildren();const chosen=$('outputs').querySelector('.chosen');if(!chosen)return;const rect=svg.getBoundingClientRect(),target=chosen.getBoundingClientRect();const tx=target.left+target.width/2-rect.left;for(const cell of $('inputs').querySelectorAll('.origin')){const r=cell.getBoundingClientRect(),sx=r.left+r.width/2-rect.left;const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${sx} 0 C ${sx} 44,${tx} 42,${tx} 86`);svg.append(p)}}
function render(){const stage=DATA.stages[stageIndex],rule=stage.rules[selected],refs=expand(rule[0]);cells('inputs',stage.input,$('ipage').value,refs,false);cells('outputs',stage.output,$('opage').value,new Set([selected]),true);$('detail').textContent=`output[${selected}] = ${stage.output[stage.output.length-1-selected]} ｜ ${rule[1]} ｜ 本步输入来源：${compress(refs)}`;$('original').textContent=compress(original());requestAnimationFrame(links)}
function choose(bit){selected=Math.max(0,Math.min(DATA.stages[stageIndex].output.length-1,Number(bit)||0));$('jump').value=selected;$('opage').value=Math.floor(selected/64);const refs=[...expand(DATA.stages[stageIndex].rules[selected][0])];if(refs.length)$('ipage').value=Math.floor(Math.max(...refs)/64);render()}
function load(){const s=DATA.stages[stageIndex];pages('ipage',s.input.length);pages('opage',s.output.length);$('jump').max=s.output.length-1;choose(Math.min(selected,s.output.length-1))}
DATA.stages.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;$('stage').append(o)});$('stage').value=stageIndex;$('stage').onchange=()=>{stageIndex=Number($('stage').value);load()};$('jump').onchange=()=>choose($('jump').value);$('ipage').onchange=render;$('opage').onchange=()=>choose(Number($('opage').value)*64);window.addEventListener('resize',links);load();
</script></html>
